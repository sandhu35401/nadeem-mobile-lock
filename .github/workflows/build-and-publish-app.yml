name: Build and Publish Customer Android App

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

concurrency:
  group: customer-app-release
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app publisher repository
        uses: actions/checkout@v4

      - name: Checkout app source from admin repository
        uses: actions/checkout@v4
        with:
          repository: sandhu35401/nadeem-mobiles
          path: source

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Firebase Android configuration
        shell: bash
        run: |
          cat > source/android-app/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "64066783078",
              "project_id": "nadeem-mobile",
              "storage_bucket": "nadeem-mobile.firebasestorage.app"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:64066783078:android:518664693e106f446c2aa7",
                "android_client_info": {
                  "package_name": "com.nadeemmobile.lock"
                }
              },
              "api_key": [{
                "current_key": ""
              }]
            }],
            "configuration_version": "1"
          }
          EOF

      - name: Enable AndroidX
        shell: bash
        run: |
          printf 'android.useAndroidX=true\nandroid.enableJetifier=true\n' > source/android-app/gradle.properties

      - name: Confirm source version
        run: echo "Building customer app source from sandhu35401/nadeem-mobiles@main"

      - name: Restore persistent signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: nadeem-mobile-debug-keystore-v1

      - name: Create persistent signing key when missing
        shell: bash
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v               -keystore ~/.android/debug.keystore               -storepass android               -keypass android               -alias androiddebugkey               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Fix Gradle wrapper permissions
        run: chmod +x source/android-app/gradlew

      - name: Build customer APK
        working-directory: source/android-app
        run: ./gradlew clean assembleRelease -PnadeemApiBaseUrl=https://nadeem-mobiles-api.user03174904469.workers.dev

      - name: Calculate DPC signing certificate checksum
        shell: bash
        run: |
          keytool -exportcert             -keystore ~/.android/debug.keystore             -storepass android             -alias androiddebugkey             -rfc > /tmp/nadeem-dpc-cert.pem

          openssl x509 -in /tmp/nadeem-dpc-cert.pem -outform DER |
            openssl dgst -sha256 -binary |
            base64 -w 0 |
            tr '+/' '-_' |
            tr -d '=' > device-owner-signature-checksum.txt

          echo "DPC signature checksum: $(cat device-owner-signature-checksum.txt)"

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Nadeem Mobile Lock v2.0.${{ github.run_number }}
          generate_release_notes: true
          make_latest: true
          files: source/android-app/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Device Owner QR assets
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "qrcode[pil]"

          python - <<'PY'
          import json
          from pathlib import Path
          import qrcode

          checksum = Path("device-owner-signature-checksum.txt").read_text().strip()

          payload = {
              "android.app.extra.PROVISIONING_DEVICE_ADMIN_COMPONENT_NAME":
                  "com.nadeemmobile.lock/com.nadeemmobile.lock.admin.LockDeviceAdminReceiver",
              "android.app.extra.PROVISIONING_DEVICE_ADMIN_PACKAGE_DOWNLOAD_LOCATION":
                  "https://github.com/sandhu35401/nadeem-mobile-lock/releases/latest/download/app-release.apk",
              "android.app.extra.PROVISIONING_DEVICE_ADMIN_SIGNATURE_CHECKSUM":
                  checksum,
              "android.app.extra.PROVISIONING_USE_MOBILE_DATA": True,
          }

          text = json.dumps(payload, separators=(",", ":"))
          Path("device-owner-qr.json").write_text(
              json.dumps(payload, indent=2) + "\n",
              encoding="utf-8"
          )

          qr = qrcode.QRCode(
              version=None,
              error_correction=qrcode.constants.ERROR_CORRECT_M,
              box_size=12,
              border=4,
          )
          qr.add_data(text)
          qr.make(fit=True)
          image = qr.make_image()
          image.save("device-owner-qr.png")

          Path("device-owner-qr.txt").write_text(text + "\n", encoding="utf-8")
          PY

      - name: Publish QR assets to GitHub Pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add device-owner-qr.png device-owner-qr.json device-owner-qr.txt
          git commit -m "Update Device Owner QR for latest APK [skip ci]" || exit 0
          git push origin main
