name: Build and Publish Customer Android App

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

concurrency:
  group: customer-app-release
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app publisher repository
        uses: actions/checkout@v4

      - name: Checkout app source from admin repository
        uses: actions/checkout@v4
        with:
          repository: sandhu35401/nadeem-mobiles
          path: source

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Firebase Android configuration
        shell: bash
        run: |
          cat > source/android-app/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "178796478534",
              "project_id": "nadeem-mobile-58f18"
            },
            "client": [{
            "client_info": {
              "mobilesdk_app_id": "1:178796478534:android:954074f9a29a020cf04a47",
              "android_client_info": {
                "package_name": "com.nadeemmobile.lock"
              }
            },
            "api_key": [{
              "current_key": ""
            }]
          }],
            "configuration_version": "1"
          }
          EOF

      - name: Enable AndroidX
        shell: bash
        run: |
          printf 'android.useAndroidX=true\nandroid.enableJetifier=true\n' > source/android-app/gradle.properties

      - name: Confirm source version
        run: echo "Building customer app source from sandhu35401/nadeem-mobiles@main"

      - name: Build customer APK
        working-directory: source/android-app
        run: ./gradlew clean assembleRelease -PnadeemApiBaseUrl=https://nadeem-mobiles-api.user03174904469.workers.dev

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Nadeem Mobile Lock v2.0.${{ github.run_number }}
          generate_release_notes: true
          make_latest: true
          files: source/android-app/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
